worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format balanced '[$time_local] $remote_addr -> $upstream_addr: "$request"';
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100;
    types_hash_max_size 2048;

    client_body_timeout 10;
    client_header_timeout 10;
    reset_timedout_connection on;

    upstream user_generator {
        server user-generator:8082;
    }

    upstream user_generator_grpc {
        server user-generator:50051;
    }

    server {
        listen 50051;
         http2 on;

        location / {
            grpc_pass grpc://user_generator_grpc;
        }
    }

    server {
        listen 80;
        server_name _;

        location /info {
            proxy_pass http://user_generator/actuator/info;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Backend-Container $upstream_addr always;
            add_header X-Upstream-Response $upstream_status always;
        }

        location /shutdown {
            proxy_pass http://user_generator/actuator/shutdown;
            proxy_method POST;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            add_header X-Backend-Container $upstream_addr always;
            add_header X-Upstream-Response $upstream_status always;
        }

        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        location /nginx-status {
            stub_status on;
            access_log off;
            allow all;
        }

        location / {
            proxy_pass http://user_generator;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header Forwarded-Proto    $scheme;
            proxy_set_header Forwarded-Host     $host;
            proxy_set_header Forwarded-Port     $server_port;

            proxy_connect_timeout           30s;
            proxy_read_timeout              60s;
            proxy_send_timeout              60s;

            proxy_buffering                 on;
            proxy_buffer_size               4k;
            proxy_buffers                   8 4k;
            proxy_busy_buffers_size         8k;

            proxy_next_upstream             error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_timeout     10s;
            proxy_next_upstream_tries       3;

            set $backend_servers webapi;
            proxy_set_header X-Backend-Server $backend_servers;
        }
    }
}