worker_processes auto;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /var/log.nginx/access.log
    error_log /var/log/nginx/error.log;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 30;
    keepalive_requests 100;
    types_hash_max_size 2048;

    client_body_timeout 10;
    client_header_timeout 10;
    reset_timedout_connection on;

    upstream webapi_backend {
        least_conn;
        server webapi:80;
    }

    server {
        listen 80;
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }
    }

    server {
        listen 80;
        server_name localhost;

        location /nginx-status {
            stub_status on;
            access_log off;
            allow all;
        }

        location / {
            proxy_pass http://webapi_backend;

            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header Forwarded-For      $proxy_add_x_forwarded_for;
            proxy_set_header Forwarded-Proto    $scheme
            proxy_set_header Forwarded-Host     $host;
            proxy_set_header Forwarded-Port     $server_port;

            proxy_connect_timeout           30s;
            proxy_read_timeout              60s;
            proxy_send_timeout              60s;

            proxy_buffering                 on;
            proxy_buffer_size               4k;
            proxy_buffers                   8 4k;
            proxy_busy_buffers_size         8k;

            proxy_next_upstream             error timeout invalid_header http_500 http_502 http_503 http_504;
            proxy_next_upstream_timeout     10s;
            proxy_next_upstream_tries       3;

            set $backend_servers webapi;
            proxy_set_header X-Backend-Server $backend_servers;
        }
    }
}