services:
  user-generator:
    build:
      context: .
      dockerfile: UserGenerator/Dockerfile
    environment:
      GRPC_SERVER_PORT: "50051"
    networks:
      - app-network
    deploy:
      replicas: 3
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8082/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

  user-registrar:
    build:
      context: .
      dockerfile: UserRegistrar/Dockerfile
    environment:
      GRPC_SERVER_HOST: nginx
      GRPC_SERVER_PORT: "50051"
    depends_on:
      user-generator:
        condition: service_healthy
      nginx:
        condition: service_healthy

    ports:
      - "8081:8081"
    networks:
      - app-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8081/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  nginx:
    image: nginx:alpine
    container_name: nginx_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
    depends_on:
      user-generator:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: [ "CMD-SHELL", "nginx -t" ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  app-network:
    driver: bridge