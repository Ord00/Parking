services:
  user_generator:
    build:
      context: ./UserGenerator
      dockerfile: Dockerfile
    networks:
      - app-network
    deploy:
      replicas: 3
    restart: unless-stopped

  user_registrar:
    build:
      context: ./UserRegistrar
      dockerfile: Dockerfile
    networks:
      - app-network

  nginx:
    image: nginx:alpine
    container_name: nginx_load_balancer
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./logs:/var/log/nginx
    depends_on:
      - user_generator
    networks:
      - app-network

networks:
  app-network:
    driver: bridge